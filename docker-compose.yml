services:
  db:
    image: postgres:18
    container_name: sast_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - sast_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sast_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  sast_postgres_data: