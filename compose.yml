services:
  db:
    image: postgres:18
    container_name: sast_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sast_postgres_data:/var/lib/postgresql
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    networks:
      - sast-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: sast_redis
    restart: always
    volumes:
      - redis_volume_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - sast-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_insight:
    image: redis/redisinsight:latest
    container_name: sast_redis_insight
    restart: always
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis_insight_volume_data:/data
    networks:
      - sast-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  sast_postgres_data:
  redis_volume_data:
  redis_insight_volume_data:

networks:
  sast-network:
    driver: bridge